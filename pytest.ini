[pytest]
testpaths = tests
norecursedirs = .venv venv env build dist
filterwarnings =
    # Pyparsing 3.2+ camelCase deprecations in Matplotlib 3.9 fontconfig & mathtext parsers under Python 3.13:
    # Exact warning text: "PyparsingDeprecationWarning: 'oneOf' deprecated - use 'one_of'"
    # Exact warning text: "PyparsingDeprecationWarning: 'parseString' deprecated - use 'parse_string'"
    # Exact warning text: "PyparsingDeprecationWarning: 'resetCache' deprecated - use 'reset_cache'"
    # Exact warning text: "PyparsingDeprecationWarning: 'enablePackrat' deprecated - use 'enable_packrat'"
    # Exact warning text: "PyparsingDeprecationWarning: 'leaveWhitespace' deprecated - use 'leave_whitespace'"
    # Exact warning text: "PyparsingDeprecationWarning: 'parseAll' argument is deprecated, use 'parse_all'"
    ignore:.*deprecated - use .*:DeprecationWarning:matplotlib\._fontconfig_pattern
    ignore:.*deprecated - use .*:DeprecationWarning:matplotlib\._mathtext
    ignore:'parseAll' argument is deprecated, use 'parse_all':DeprecationWarning:pyparsing\.util
    # Headless Agg backend figure canvas notification (narrowed to specific pattern, does not filter all UserWarnings):
    # Exact warning text: "UserWarning: FigureCanvasAgg is non-interactive, and thus cannot be shown"
    ignore:FigureCanvasAgg is non-interactive.*:UserWarning:matplotlib\.backend_bases
